<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation - Le Délice</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Le Délice</h1>

        <nav>
            <a href="index.html">Accueil</a>
            <a href="menu.html">Menu</a>
            <a href="galerie.html">Galerie</a>
            <a href="Reservation.html" class="active">Réservation</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="reservation" id="reservation">

        <h2>Réservation</h2>
        <h3>Réservez votre table</h3>

        <form id="formReservation" class="formulaire" novalidate>

            <div class="champ">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" autocomplete="name">
                <span class="erreur" id="erreur-nom"></span>
            </div>

            <div class="champ">
                <label for="telephone">Téléphone</label>
                <input type="tel" id="telephone" name="telephone" autocomplete="tel" placeholder="06 00 00 00 00">
                <span class="erreur" id="erreur-telephone"></span>
            </div>

            <div class="champ">
                <label for="date">Date</label>
                <input type="date" id="date" name="date">
                <span class="erreur" id="erreur-date"></span>
            </div>

            <div class="champ">
                <label for="heure">Heure</label>
                <input type="time" id="heure" name="heure">
                <span class="erreur" id="erreur-heure"></span>
            </div>

            <div class="champ">
                <label for="personnes">Nombre de personnes</label>
                <input type="number" id="personnes" name="personnes" min="1" max="12">
                <span class="erreur" id="erreur-personnes"></span>
            </div>

            <button type="submit" class="bouton bouton-reserver" id="btnReserver">Réserver</button>

            <div class="confirmation" id="confirmation" hidden></div>

        </form>

    </section>

    <footer>
        <h2>Le Délice</h2>
        <p>12 Rue ABCDE, Casablanca · +212 0 00 00 00 00 · © 2026 Le Délice</p>
    </footer>

    <script src="Reservation.js"></script>

</body>
</html>
